# Infinite World - Example Case Prompts
# Format: [prompt, condition_image_path, action_json_path]
prompts:
  - - Imagine yourself exploring an abandoned bus station late at night. Flickering fluorescent lights cast pale, unsteady beams across cracked concrete floors littered with old newspapers and broken glass. The rusted steel frames of empty bus bays loom in the darkness, their destination signs frozen on routes long since cancelled. The air is heavy with the smell of damp concrete and diesel. Weeds push through gaps in the pavement, and peeling paint reveals layers of forgotten schedules on the walls. The distant hum of wind through broken windows is the only sound, punctuated by the occasional creak of a corrugated metal door swinging on its hinges. Shadows pool in the corners of the desolate waiting area, where rows of bolted-down plastic seats sit empty under a sagging ceiling.
    - ./assets/example_case/bus/1768786343.png
    - ./assets/example_case/bus/0001.json

  - - Imagine yourself walking through the bustling Grand Central Station on a bright Sunday afternoon. The sunlight streams through the iconic arched windows, casting golden beams onto the marble floors. The hum of conversations, the rhythmic announcements of train departures, and the occasional sound of rolling suitcases fill the air. You pass by the famous clock at the center of the main concourse, where people gather to meet. The aroma of fresh coffee and baked goods wafts from nearby cafes. As you explore, you notice the intricate details of the celestial ceiling above, depicting constellations in a soft teal hue. The station feels alive yet calm, a perfect blend of history and modern energy.
    - ./assets/example_case/gc/image.png
    - ./assets/example_case/gc/0001.json

  - - Imagine yourself wandering around a cozy kitchen on a quiet morning. The sunlight streams through the window, illuminating the wooden countertops and the faint steam rising from a freshly brewed cup of coffee. The aroma of baked bread and sizzling bacon fills the air. You hear the gentle hum of the refrigerator and the occasional clink of utensils as you explore. The shelves are lined with jars of spices, and a bowl of fresh fruit sits on the table. The warmth of the room invites you to linger and enjoy the peaceful atmosphere.
    - ./assets/example_case/kitchen/image.png
    - ./assets/example_case/kitchen/0001.json

